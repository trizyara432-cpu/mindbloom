<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom - Reabilitação Cognitiva e Emocional</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        #app {
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        header {
            margin-bottom: 30px;
        }
        h1 {
            color: #4CAF50;
            font-size: 2.5em;
        }
        p {
            font-size: 1.1em;
            color: #666;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        #exercise-content {
            margin: 20px 0;
            font-size: 1.1em;
        }
        #feedback {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e8;
            border-radius: 8px;
            border-left: 5px solid #4CAF50;
        }
        #dashboard p {
            font-size: 1.2em;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>MindBloom</h1>
            <p>Seu jardim mental cresce com a prática diária. Exercícios curtos para estimular neuroplasticidade, melhorar atenção, memória e reduzir ansiedade.</p>
        </header>
        <main>
            <div id="dashboard" class="hidden">
                <h2>Seu Progresso</h2>
                <p>Dias consecutivos: <span id="streak">0</span></p>
                <p>Nível: <span id="level">1</span></p>
                <p>Conquistas: <span id="achievements">Nenhuma ainda.</span></p>
                <button id="back-to-menu">Voltar ao Menu</button>
            </div>
            <div id="menu">
                <button id="start-session">Iniciar Sessão</button>
                <button id="view-progress">Ver Progresso</button>
            </div>
            <div id="exercise" class="hidden">
                <h2 id="exercise-title"></h2>
                <div id="exercise-content"></div>
                <button id="next-step">Próximo</button>
                <button id="pause">Pausa Emocional</button>
                <div id="feedback" class="hidden"></div>
            </div>
        </main>
    </div>
    <script>
        // Dados do usuário (salvos localmente no navegador)
        let userData = JSON.parse(localStorage.getItem('mindbloom')) || {
            streak: 0,
            level: 1,
            lastDate: null,
            achievements: []
        };

        // Exercícios (baseados em neuroplasticidade: repetição espaçada, adaptação gradual, feedback positivo)
        const exercises = [
            {
                name: 'Foco de Atenção',
                duration: 5,
                steps: [
                    'Observe a grade e encontre o item diferente.',
                    'Clique no item correto.',
                    'Parabéns! Você focou bem. Isso fortalece conexões neurais para atenção sustentada.'
                ],
                content: '<p>Grade: [A B C D] - Qual é diferente? (Simule: Clique em "B").</p>'
            },
            {
                name: 'Memória Visual',
                duration: 7,
                steps: [
                    'Memorize a sequência: Vermelho, Azul, Verde.',
                    'Recrie a sequência.',
                    'Ótimo! Sua memória está fortalecendo. Repetição espaçada reforça o hipocampo.'
                ],
                content: '<p>Sequência: Vermelho, Azul, Verde. Agora recrie.</p>'
            },
            {
                name: 'Compreensão de Leitura',
                duration: 10,
                steps: [
                    'Leia o texto curto.',
                    'Responda: O que o texto diz?',
                    'Excelente compreensão! Isso estimula a rede de leitura no cérebro.'
                ],
                content: '<p>Texto: "O sol brilha no céu." O que brilha?</p>'
            },
            {
                name: 'Raciocínio Lógico',
                duration: 10,
                steps: [
                    'Resolva: 1, 3, 5, ?',
                    'Resposta: 7.',
                    'Seu raciocínio está afiado! Adaptação gradual reduz estresse cognitivo.'
                ],
                content: '<p>Sequência: 1, 3, 5, ?</p>'
            },
            {
                name: 'Organização Executiva',
                duration: 15,
                steps: [
                    'Liste tarefas: 1. Ler, 2. Exercitar.',
                    'Organize por prioridade.',
                    'Você está organizando bem! Isso melhora funções executivas no córtex pré-frontal.'
                ],
                content: '<p>Tarefas: Ler, Exercitar. Organize.</p>'
            }
        ];

        let currentExercise = null;
        let currentStep = 0;

        // Funções principais
        function updateDashboard() {
            document.getElementById('streak').textContent = userData.streak;
            document.getElementById('level').textContent = userData.level;
            document.getElementById('achievements').textContent = userData.achievements.join(', ') || 'Nenhuma ainda.';
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (userData.lastDate !== today) {
                if (userData.lastDate === new Date(Date.now() - 86400000).toDateString()) {
                    userData.streak++;
                } else {
                    userData.streak = 1; // Reset suave para evitar frustração
                }
                userData.lastDate = today;
                if (userData.streak % 7 === 0) userData.level++;
                localStorage.setItem('mindbloom', JSON.stringify(userData));
            }
        }

        function startSession() {
            checkStreak();
            currentExercise = exercises[Math.floor(Math.random() * exercises.length)];
            currentStep = 0;
            document.getElementById('exercise-title').textContent = currentExercise.name;
            document.getElementById('exercise-content').innerHTML = currentExercise.content;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('exercise').classList.remove('hidden');
            document.getElementById('feedback').classList.add('hidden');
        }

        function nextStep() {
            currentStep++;
            if (currentStep < currentExercise.steps.length) {
                document.getElementById('exercise-content').innerHTML = '<p>' + currentExercise.steps[currentStep] + '</p>';
            } else {
                document.getElementById('feedback').textContent = 'Sessão completa! Você está progredindo. Seu jardim mental cresce. Continue assim para estimular neuroplasticidade.';
                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('exercise').classList.add('hidden');
                document.getElementById('menu').classList.remove('hidden');
            }
        }

        function pauseEmotional() {
            document.getElementById('exercise-content').innerHTML = '<p>Respire profundamente por 30 segundos. Pense: "Eu sou capaz e estou progredindo." Isso regula ansiedade e fortalece resiliência emocional.</p>';
            setTimeout(() => {
                document.getElementById('exercise-content').innerHTML = '<p>Retorne ao exercício quando estiver pronta.</p>';
            }, 30000);
        }

        function backToMenu() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        // Eventos
        document.getElementById('start-session').onclick = startSession;
        document.getElementById('view-progress').onclick = () => {
            updateDashboard();
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('menu').classList.add('hidden');
        };
        document.getElementById('next-step').onclick = nextStep;
        document.getElementById('pause').onclick = pauseEmotional;
        document.getElementById('back-to-menu').onclick = backToMenu;

        // Inicialização
        updateDashboard();
    </script>
</body>
</html>
